[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ga4audit"
version = "2.0.0"
description = "Audit a GA4 implementation against a tracking plan — from a BigQuery export or the GA4 Data API"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Mehran Moghadasi" }]
keywords = ["ga4", "google-analytics", "tracking-plan", "measurement-plan", "audit", "analytics-qa"]
dependencies = []

[project.optional-dependencies]
api = ["google-analytics-data>=0.18", "google-auth>=2.28"]
dev = ["pytest>=8", "ruff>=0.5"]

[project.scripts]
ga4audit = "ga4audit.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 140
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "DTZ"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
